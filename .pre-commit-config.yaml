ci:
  autoupdate_schedule: "quarterly"

default_language_version:
  python: "python3.13"

exclude: "tests/installed-projects|shift_jis\\.py"

repos:
  - repo: "meta"
    hooks:
      - id: "check-hooks-apply"
      - id: "check-useless-excludes"

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
    hooks:
      - id: "check-added-large-files"
      - id: "check-merge-conflict"
      - id: "check-yaml"
      - id: "end-of-file-fixer"
      - id: "mixed-line-ending"
        args:
          - "--fix=lf"
      - id: "trailing-whitespace"

  - repo: "https://github.com/asottile/pyupgrade"
    rev: "75992aaa40730136014f34227e0135f63fc951b4"  # frozen: v3.21.2
    hooks:
      - id: "pyupgrade"
        name: "Enforce Python 3.10+ idioms"
        args: ["--py310-plus"]

  - repo: "https://github.com/sirosen/slyp"
    rev: "072ea633cef088f143be7c16499d1564485dfc0c"  # frozen: 0.9.0
    hooks:
      - id: "slyp"

  - repo: "https://github.com/psf/black-pre-commit-mirror"
    rev: "4160603246a6b365d4a2af661c6d71b0a0f50478"  # frozen: 26.5.1
    hooks:
      - id: "black"

  - repo: "https://github.com/pycqa/isort"
    rev: "131f4adcd5582bfc53928ab0d740eceb8b506b6c"  # frozen: 9.0.1
    hooks:
      - id: "isort"

  - repo: "https://github.com/pycqa/flake8"
    rev: "c48217e1fc006c2dddd14df54e83b67da15de5cd"  # frozen: 7.3.0
    hooks:
      - id: "flake8"
        additional_dependencies:
          - "flake8-toml-config==1.0.0"
          - "flake8-bugbear==26.9.30"

  - repo: "https://github.com/editorconfig-checker/editorconfig-checker"
    rev: "e98e4ec6d3bb64b4b62ec4f0ce6cacdfba12f9a0"  # frozen: v4.0.1
    hooks:
      - id: "editorconfig-checker"

  - repo: "https://github.com/python-jsonschema/check-jsonschema"
    rev: "12e63946db2c5cfcc9030fac21c3883ba88c6ed8"  # frozen: 0.38.0
    hooks:
      - id: "check-dependabot"
      - id: "check-readthedocs"

  - repo: "https://github.com/rhysd/actionlint"
    rev: "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
    hooks:
      - id: "actionlint"
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@4e7020840c303923eb1ab846fc446d77be892570"

  - repo: "https://github.com/kurtmckee/pre-commit-hooks"
    rev: "44b638c826f1acd2ba2c5995db3156be60c5efea"  # frozen: v1.0.0
    hooks:
      - id: "verify-consistent-pyproject-toml-python-requirements"

  - repo: "https://github.com/shellcheck-py/shellcheck-py"
    rev: "a6564f5d57444e123433a5c9af733e3975c77229"  # frozen: v0.11.0.1-1
    hooks:
    -   id: "shellcheck"
        args: [
          "-e", "SC1091",  # Ignore non-existent 'source ...' targets.
        ]

  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
    hooks:
    - id: "zizmor"
